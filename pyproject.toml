[project]
name = "ghosttrace"
version = "0.1.0"
description = "Track and detect suspicious dataframe transformations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "Your Name" }
]

dependencies = [
    "pandas",
    "numpy",
    "rich"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
pythonpath = [
    "src"
]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "pandas-stubs>=3.0.0.260204",
    "twine>=6.2.0",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true